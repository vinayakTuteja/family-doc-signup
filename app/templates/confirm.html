{% extends "base.html" %}
{% block title %}{{ title }} · {{ settings.app_name }}{% endblock %}
{% block content %}
<section class="card message">
  <h1>{{ title }}</h1>
  <p>{{ body }}</p>
  <form method="post" action="{{ action }}">
    <button type="submit" class="button">{{ button }}</button>
  </form>
</section>
{% endblock %}
