# Fly.io config. Toronto region (yyz) keeps the database on Canadian servers.
# Change "app" to a unique name before your first deploy.
app = "family-doc-signup"
primary_region = "yyz"

[build]

[env]
  DATABASE_PATH = "/data/signup.db"
  OUTBOX_DIR = "/data/outbox"
  RUN_RETENTION_IN_APP = "true"

[[mounts]]
  source = "signup_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
